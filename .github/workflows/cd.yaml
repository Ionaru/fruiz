name: Deals CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
      - run: deno audit

  get_sha:
    name: Get short SHA for image tags
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.get_sha.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v6
      - id: get_sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  lint:
    name: Static code analysis
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
      - run: deno install --frozen
      - run: deno task check

  test:
    name: Unit tests
    needs: [audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
      - run: deno install --frozen
      - run: mkdir data
      - run: deno task db:sync
      - run: deno task test

  build-image:
    name: Build image
    needs: [audit, get_sha]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f deploy/compose.yaml build server --build-arg FRUIZ_GIT_REVISION=${{needs.get_sha.outputs.sha_short}}
      - run: docker save -o server-image.tar ghcr.io/ionaru/fruiz/server:latest
      - uses: actions/upload-artifact@v7
        with:
          name: server-image
          path: server-image.tar
          retention-days: 1

  push-image:
    name: Push image
    if: github.event_name == 'push'
    needs: [get_sha, lint, test, build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server-image
      - run: docker load -i server-image.tar
      - run: docker tag ghcr.io/ionaru/fruiz/server:latest ghcr.io/ionaru/fruiz/server:${{needs.get_sha.outputs.sha_short}}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push -a ghcr.io/ionaru/fruiz/server

  deploy:
    needs: [get_sha, push-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Wait for image to be available in GHCR
        run: |
          IMAGE="ghcr.io/ionaru/fruiz/server:${{needs.get_sha.outputs.sha_short}}"
          MAX_RETRIES=30
          SLEEP_SECONDS=2

          for i in $(seq 1 $MAX_RETRIES); do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "Image is available"
              exit 0
            fi

            echo "Waiting for image... ($i/$MAX_RETRIES)"
            sleep $SLEEP_SECONDS
          done

          echo "Image not available after waiting"
          exit 1
      - uses: appleboy/ssh-action@v1.2.5
        with:
          command_timeout: 30m
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch -a
            git switch -d ${{needs.get_sha.outputs.sha_short}}
            docker system prune --all -f
            $env:FRUIZ_GIT_REVISION = "${{needs.get_sha.outputs.sha_short}}"
            docker compose -f deploy/compose.yaml pull server
            docker compose -f deploy/compose.yaml up server --pull=never --no-build --remove-orphans -d
            $env:FRUIZ_GIT_REVISION = $null
