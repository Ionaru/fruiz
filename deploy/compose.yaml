services:
  server:
    image: ghcr.io/ionaru/fruiz/server:${FRUIZ_GIT_REVISION:-latest}
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    environment:
      - FRUIZ_SECURE_COOKIES
      - FRUIZ_RP_ID
      - FRUIZ_DEBUG
      # OpenTelemetry → SigNoz (spec 12). Deno's built-in OTEL exports OTLP
      # http/protobuf to port 4318; host.docker.internal reaches the collector's
      # published host ports. Override the endpoint for other collectors.
      - OTEL_DENO=true
      - OTEL_SERVICE_NAME=fruiz
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${FRUIZ_GIT_REVISION:-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRUIZ_PORT:-8000}:8000"
    volumes:
      - ${FRUIZ_DATA_VOLUME:-data}:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "if (!(await fetch('http://127.0.0.1:8000/')).ok) Deno.exit(1)"
      start_period: 600s
      interval: 15s
      timeout: 10s
      retries: 5
    # Backfill skips unchanged files (size+mtime fingerprint); use `playback-gain:backfill -- --force` for full re-measure.
    command:
      - /bin/sh
      - -c
      - deno task db:sync && deno task playback-gain:backfill && exec deno task start

volumes:
  data:
