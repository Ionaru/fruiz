services:
  server:
    image: ghcr.io/ionaru/fruiz/server:${FRUIZ_GIT_REVISION:-latest}
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    ports:
      - "${FRUIZ_PORT:-8000}:8000"
    volumes:
      - ${FRUIZ_DATA_VOLUME:-data}:/app/data
    post_start:
      - command: deno task db:sync
    restart: unless-stopped

volumes:
  data:
